name: Windows self-hosted validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full Windows validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          dotnet --info
          powershell.exe -NoLogo -NoProfile -Command '$PSVersionTable | Format-List'
          if (Get-Command pwsh.exe -ErrorAction SilentlyContinue) {
            pwsh.exe -NoLogo -NoProfile -Command '$PSVersionTable | Format-List'
          }

      - name: Ensure validation modules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          }

          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }

          $gallery = Get-PSRepository -Name PSGallery -ErrorAction Stop
          $originalPolicy = [string]$gallery.InstallationPolicy
          try {
            if ($originalPolicy -ne 'Trusted') {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            }

            $pester = Get-Module -ListAvailable Pester |
              Where-Object { $_.Version -eq [version]'5.7.1' } |
              Select-Object -First 1
            if (-not $pester) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
            }

            $analyzer = Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object { $_.Version -eq [version]'1.25.0' } |
              Select-Object -First 1
            if (-not $analyzer) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
            }
          }
          finally {
            if ($originalPolicy -and $originalPolicy -ne 'Trusted') {
              Set-PSRepository -Name PSGallery -InstallationPolicy $originalPolicy
            }
          }

      - name: Run full release validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\Invoke-ReleaseValidation.ps1 `
            -Full

      - name: Run real packaged GUI startup smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageOutput = Join-Path $env:RUNNER_TEMP 'wib-gui-startup-package'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'wib-gui-startup-extracted'
          $settingsPath = Join-Path $env:LOCALAPPDATA 'WindowsISOBuilder\settings.json'
          $settingsBackup = Join-Path $env:RUNNER_TEMP 'wib-gui-startup-settings-backup.json'
          $process = $null

          try {
            foreach ($path in @($packageOutput, $extractRoot)) {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force
              }
            }
            New-Item -ItemType Directory -Path $packageOutput -Force | Out-Null

            if (Test-Path -LiteralPath $settingsBackup) {
              Remove-Item -LiteralPath $settingsBackup -Force
            }
            if (Test-Path -LiteralPath $settingsPath) {
              Copy-Item -LiteralPath $settingsPath -Destination $settingsBackup -Force
              Remove-Item -LiteralPath $settingsPath -Force
            }

            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\tools\New-ReleasePackage.ps1 `
              -Version 1.0.0 `
              -OutputDirectory $packageOutput
            if ($LASTEXITCODE -ne 0) {
              throw "New-ReleasePackage.ps1 failed with exit code $LASTEXITCODE."
            }

            $zip = Join-Path $packageOutput 'windows-iso-builder-v1.0.0.zip'
            Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force
            $packageRoot = Join-Path $extractRoot 'windows-iso-builder-v1.0.0'
            $exe = Join-Path $packageRoot 'WindowsISOBuilder.exe'
            $backend = Join-Path $packageRoot 'Invoke-WibBackend.ps1'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Packaged GUI executable is missing.' }
            if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) { throw 'Packaged backend entry point is missing.' }
            if (@(Get-ChildItem -LiteralPath $packageRoot -File -Filter '*.dll').Count -ne 0) {
              throw 'Packaged GUI root contains unexpected DLL files.'
            }

            $log = Join-Path $env:LOCALAPPDATA ('WindowsISOBuilder\logs\gui-' + (Get-Date -Format 'yyyyMMdd') + '.log')
            $before = if (Test-Path -LiteralPath $log) { [IO.File]::ReadAllText($log).Length } else { 0 }
            $runnerSessionId = (Get-Process -Id $PID).SessionId
            $interactiveDesktop = [Environment]::UserInteractive -and $runnerSessionId -ne 0
            Write-Host "Runner sessionId=$runnerSessionId userInteractive=$([Environment]::UserInteractive) requireWindowHandle=$interactiveDesktop"

            $process = Start-Process -FilePath $exe -WorkingDirectory $packageRoot -PassThru
            $windowReady = $false
            $startupReady = $false
            $newLog = ''

            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { break }

              if ($process.MainWindowHandle -ne 0) {
                $windowReady = $true
              }

              if (Test-Path -LiteralPath $log) {
                $allLog = [IO.File]::ReadAllText($log)
                if ($allLog.Length -gt $before) {
                  $newLog = $allLog.Substring($before)
                  $startupReady = (
                    $newLog -match 'backend resolved' -and
                    $newLog -match 'guiVersion=1\.0\.0\s+backendApplicationVersion=1\.0\.0\s+contractSchema=1\s+buildPlanSchema=1' -and
                    $newLog -match 'state=Idle'
                  )
                }
              }

              if ($startupReady -and (-not $interactiveDesktop -or $windowReady)) {
                break
              }
            }

            if (Test-Path -LiteralPath $log) {
              $allLog = [IO.File]::ReadAllText($log)
              if ($allLog.Length -gt $before) {
                $newLog = $allLog.Substring($before)
              }
            }

            if ($newLog -match '\[ERROR\]\s+Unhandled (UI|application) exception') {
              Write-Host '--- GUI startup error log ---'
              $newLog -split "`r?`n" | ForEach-Object { if ($_ -ne '') { Write-Host $_ } }
              Write-Host '--- end GUI startup error log ---'
              throw 'Packaged GUI reported an unhandled exception during startup smoke.'
            }

            if ($process.HasExited) {
              Write-Host "Packaged GUI exited during startup smoke with code $($process.ExitCode)."
              if ($newLog) {
                Write-Host '--- GUI startup log ---'
                $newLog -split "`r?`n" | ForEach-Object { if ($_ -ne '') { Write-Host $_ } }
                Write-Host '--- end GUI startup log ---'
              }
              throw 'Packaged GUI did not remain alive through startup smoke.'
            }

            if (-not $startupReady) {
              if ($newLog) {
                Write-Host '--- GUI startup log ---'
                $newLog -split "`r?`n" | ForEach-Object { if ($_ -ne '') { Write-Host $_ } }
                Write-Host '--- end GUI startup log ---'
              }
              throw 'Packaged GUI did not complete the startup backend handshake.'
            }

            if ($interactiveDesktop -and -not $windowReady) {
              if ($newLog) {
                Write-Host '--- GUI startup log ---'
                $newLog -split "`r?`n" | ForEach-Object { if ($_ -ne '') { Write-Host $_ } }
                Write-Host '--- end GUI startup log ---'
              }
              throw 'Interactive packaged GUI process stayed alive but did not create a main window.'
            }

            if ($interactiveDesktop) {
              Write-Host 'Packaged GUI completed its backend handshake, created a main window, and remained alive without unhandled exceptions.'
            }
            else {
              Write-Host 'Packaged GUI completed its backend handshake and remained alive without unhandled exceptions. Window-handle assertion skipped because the self-hosted runner has no interactive desktop session.'
            }
          }
          finally {
            if ($null -ne $process) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
                }
              }
              catch { }
            }

            if (Test-Path -LiteralPath $settingsPath) {
              Remove-Item -LiteralPath $settingsPath -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $settingsBackup) {
              New-Item -ItemType Directory -Path (Split-Path -Parent $settingsPath) -Force | Out-Null
              Move-Item -LiteralPath $settingsBackup -Destination $settingsPath -Force
            }

            foreach ($path in @($packageOutput, $extractRoot)) {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-report
          path: |
            validation-result.json
            pester-result.json
          if-no-files-found: warn
          retention-days: 14
